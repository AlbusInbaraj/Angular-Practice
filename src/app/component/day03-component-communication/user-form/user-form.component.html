<div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; max-width: 400px; margin: 0 auto;">
    <h3>{{ userForm.id === 0 ? 'Create New User' : 'Edit User' }}</h3>

    <form (ngSubmit)="submitForm()">
        <div style="margin-bottom: 10px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Name:</label>
          <input [(ngModel)]="userForm.name" name="name" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 10px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Email:</label>
          <input [(ngModel)]="userForm.email" name="email" type="email" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Role:</label>
          <input [(ngModel)]="userForm.role" name="role" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        <button type="submit" style="background: #28a745; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold;">
          {{ userForm.id === 0 ? 'Insert User' : 'Save Changes' }}
        </button>
        
        @if (userForm.id !== 0) {
          <button type="button" (click)="cancelEdit()" style="background: #6c757d; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; margin-left: 8px;">Cancel</button>
        }
    </form>
</div>
