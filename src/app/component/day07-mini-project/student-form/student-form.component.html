<div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; max-width: 400px; margin: 0 auto;">
    <h3>{{ studentForm.id === 0 ? 'Create New Student' : 'Edit Student' }}</h3>

    <form (ngSubmit)="submitForm()">
        <div style="margin-bottom: 10px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Name:</label>
          <input [(ngModel)]="studentForm.name" name="name" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 10px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Email:</label>
          <input [(ngModel)]="studentForm.email" name="email" type="email" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Age:</label>
          <input [(ngModel)]="studentForm.age" name="age" type="number" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Gender:</label>
          <input [(ngModel)]="studentForm.gender"  type="radio" id="male" name="color" value="male" required style="width: 100%; padding: 6px; box-sizing: border-box;">
          <label for="male">Male</label><br>

          <input [(ngModel)]="studentForm.gender" type="radio" id="female" name="color"  value="female" checked required style="width: 100%; padding: 6px; box-sizing: border-box;">
          <label for="female">Female</label><br>
        </div>
        <div style="margin-bottom: 15px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Date of Birth:</label>
          <input [(ngModel)]="studentForm.dateOfBirth" name="age" type="number" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        <div style="margin-bottom: 10px;">
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Contact Number:</label>
          <input [(ngModel)]="studentForm.contactNumber" name="contactNumber" required style="width: 100%; padding: 6px; box-sizing: border-box;" />
        </div>
        
        <button type="submit" style="background: #28a745; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold;">
          {{ studentForm.id === 0 ? 'Insert Student' : 'Save Changes' }}
        </button>
        
        @if (studentForm.id !== 0) {
          <button type="button" (click)="cancelEdit()" style="background: #6c757d; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; margin-left: 8px;">Cancel</button>
        }
    </form>
</div>
